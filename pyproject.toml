[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testpilot"
version = "0.1.0"
description = "Intelligent REST API Testing Agent for Spring Boot / OpenAPI 3.x"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "prance>=23.6.21.0",
    "openapi-spec-validator>=0.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
testpilot = "testpilot.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: end-to-end tests requiring external services (e.g. Spring Boot)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/testpilot"]
